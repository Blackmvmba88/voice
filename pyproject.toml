[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-vocal-hero"
version = "0.1.0"
description = "Local-first explainable vocal pitch and scoring prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
blackmamba-voice = "blackmamba_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
