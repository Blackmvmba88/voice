[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "blackmamba-vocal-hero"
version = "0.1.0"
description = "Local-first vocal pitch engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
blackmamba-voice = "blackmamba_voice.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
